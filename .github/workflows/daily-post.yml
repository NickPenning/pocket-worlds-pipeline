name: Daily Instagram Reel

on:
  schedule:
    # 1x per dag, 07:00 Amsterdam-tijd. GitHub Actions cron gebruikt UTC, dus dit
    # is 05:00 UTC in de zomertijd (CEST, exact) en 06:00 UTC in de wintertijd
    # (CET, dan 1 uur vroeger: 06:00 lokaal). 05:00 UTC dekt het hele jaar
    # redelijk goed; stel bij indien gewenst.
    - cron: "0 5 * * *"
  workflow_dispatch: {}  # laat je 'm ook handmatig starten via de GitHub-interface, handig om te testen

permissions:
  contents: write  # nodig om de gegenereerde video terug te committen naar de repo

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Installeer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Bepaal unieke post-id voor deze run
        # Bevat ook de tijd (niet alleen de datum) zodat een handmatige extra run op dezelfde
        # dag (via workflow_dispatch) de dagelijkse post niet overschrijft vóór publicatie.
        run: echo "POST_ID=$(date -u +'%Y-%m-%dT%H%M')" >> "$GITHUB_ENV"

      - name: Genereer concept, beeld en video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
        run: python generate_post.py --generate

      - name: Commit en push de nieuwe video
        run: |
          git config user.name "pocket-worlds-bot"
          git config user.email "actions@github.com"
          git add media/
          git commit -m "Content voor $POST_ID"
          git push

      - name: Publiceer op Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_PUBLIC_BASE_URL: ${{ secrets.MEDIA_PUBLIC_BASE_URL }}
        run: python generate_post.py --publish "$POST_ID"
